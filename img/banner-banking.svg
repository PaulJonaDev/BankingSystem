<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Sistema Bancario - Java POO</title>
  <desc id="d">Banner del Sistema Bancario en Java con tres tarjetas: Ahorros, Corriente e Inversion</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1f44"/>
      <stop offset="1" stop-color="#14396e"/>
    </linearGradient>
    <style>
      .title{font:800 60px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:-1px}
      .sub{font:500 23px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#cfe0ff}
      .pill{font:700 15px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#0a1f44}
      .ct{font:700 22px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#fff}
      .cs{font:500 14px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#cfe0ff}
      .float{animation:f 4s ease-in-out infinite}
      .d2{animation-delay:.6s}.d3{animation-delay:1.2s}
      @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <circle cx="1120" cy="30" r="150" fill="#fff" opacity=".04"/>
  <circle cx="60" cy="310" r="110" fill="#fff" opacity=".04"/>

  <!-- Icono banco -->
  <g transform="translate(70 80)">
    <rect width="76" height="76" rx="18" fill="#f5b942"/>
    <path d="M38 16 L62 28 H14 Z" fill="#0a1f44"/>
    <rect x="18" y="32" width="8" height="22" rx="2" fill="#0a1f44"/>
    <rect x="34" y="32" width="8" height="22" rx="2" fill="#0a1f44"/>
    <rect x="50" y="32" width="8" height="22" rx="2" fill="#0a1f44"/>
    <rect x="14" y="58" width="48" height="5" rx="2" fill="#0a1f44"/>
  </g>

  <text x="170" y="136" class="title">Sistema Bancario</text>
  <text x="72" y="206" class="sub">Gestión de cuentas con Programación Orientada a Objetos</text>

  <g transform="translate(72 236)">
    <rect width="190" height="34" rx="17" fill="#f5b942"/>
    <text x="95" y="22" text-anchor="middle" class="pill">Java · IntelliJ IDEA</text>
  </g>

  <!-- Tarjetas -->
  <g class="float" transform="translate(690 50)">
    <rect width="150" height="200" rx="16" fill="#0d2b5c" stroke="#f5b942" stroke-width="2"/>
    <circle cx="75" cy="58" r="24" fill="#f5b942"/>
    <text x="75" y="67" text-anchor="middle" style="font:800 26px sans-serif;fill:#0a1f44">$</text>
    <text x="75" y="118" text-anchor="middle" class="ct">Ahorros</text>
    <text x="75" y="144" text-anchor="middle" class="cs">Intereses</text>
    <text x="75" y="164" text-anchor="middle" class="cs">mensuales</text>
  </g>
  <g class="float d2" transform="translate(860 50)">
    <rect width="150" height="200" rx="16" fill="#0d2b5c" stroke="#f5b942" stroke-width="2"/>
    <circle cx="75" cy="58" r="24" fill="#f5b942"/>
    <text x="75" y="67" text-anchor="middle" style="font:800 22px sans-serif;fill:#0a1f44">⇄</text>
    <text x="75" y="118" text-anchor="middle" class="ct">Corriente</text>
    <text x="75" y="144" text-anchor="middle" class="cs">Sobregiro</text>
    <text x="75" y="164" text-anchor="middle" class="cs">autorizado</text>
  </g>
  <g class="float d3" transform="translate(1030 50)">
    <rect width="130" height="200" rx="16" fill="#0d2b5c" stroke="#f5b942" stroke-width="2"/>
    <circle cx="65" cy="58" r="24" fill="#f5b942"/>
    <text x="65" y="67" text-anchor="middle" style="font:800 24px sans-serif;fill:#0a1f44">↗</text>
    <text x="65" y="118" text-anchor="middle" class="ct">Inversión</text>
    <text x="65" y="144" text-anchor="middle" class="cs">Plazo fijo</text>
    <text x="65" y="164" text-anchor="middle" class="cs">en meses</text>
  </g>
</svg>
